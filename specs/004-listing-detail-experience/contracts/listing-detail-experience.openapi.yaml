openapi: 3.1.0
info:
  title: Real Estate Portal - Listing Detail Experience
  version: 0.1.0
  description: |
    Contract reference for listing detail consumption used by the upgraded
    listing detail page experience (hero carousel, neighborhood preview,
    contact section).
servers:
  - url: /
paths:
  /api/market-listings/{id}:
    get:
      summary: Get listing detail by id
      operationId: getListingDetail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Listing detail found
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: "#/components/schemas/ListingDetail"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

components:
  schemas:
    ListingImage:
      type: object
      required: [url, type, sortOrder]
      properties:
        url:
          type: string
          format: uri
        type:
          type: string
        sortOrder:
          type: integer
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true

    TransitInfo:
      type: object
      properties:
        nearestMetroStopId:
          type: string
          format: uuid
          nullable: true
        nearestMetroStopName:
          type: string
          nullable: true
        nearestMetroLine:
          type: string
          nullable: true
        nearestMetroDistanceM:
          type: integer
          nullable: true
        nearestMetroWalkMin:
          type: integer
          nullable: true
        nearestTramDistanceM:
          type: integer
          nullable: true
        nearestBusDistanceM:
          type: integer
          nullable: true
        nearestTrainDistanceM:
          type: integer
          nullable: true
        transitScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        transitScoreBand:
          type: string
          enum: [low, medium, high]
          nullable: true

    ListingDetail:
      type: object
      required:
        - id
        - title
        - locality
        - sourceUrl
        - sourceKey
        - sourceListingId
        - currency
        - images
        - galleryPreviewUrls
        - imageCount
        - firstSeenAt
        - lastSeenAt
        - isActive
      properties:
        id:
          type: string
          format: uuid
        sourceKey:
          type: string
        sourceListingId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        sourceUrl:
          type: string
          format: uri
        locality:
          type: string
        city:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        countryCode:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        offerType:
          type: string
          nullable: true
        propertyType:
          type: string
          nullable: true
        disposition:
          type: string
          nullable: true
        floorAreaM2:
          type: number
          nullable: true
        landAreaM2:
          type: number
          nullable: true
        floorNumber:
          type: number
          nullable: true
        totalFloors:
          type: number
          nullable: true
        priceAmount:
          type: number
          nullable: true
        currency:
          type: string
        priceNote:
          type: string
          nullable: true
        isActive:
          type: boolean
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        previewImageUrl:
          type: string
          format: uri
          nullable: true
        galleryPreviewUrls:
          type: array
          items:
            type: string
            format: uri
        imageCount:
          type: integer
        isSaved:
          type: boolean
        transit:
          $ref: "#/components/schemas/TransitInfo"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ListingImage"
        metadata:
          type: object
          nullable: true
          additionalProperties: true
